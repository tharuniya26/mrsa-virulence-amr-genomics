[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mrsa-virulence-amr-genomics"
version = "0.1.0"
description = "Exploratory analysis of public Staphylococcus aureus reference assemblies"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "reportlab>=4,<6"]

[tool.setuptools.packages.find]
include = ["src*"]
